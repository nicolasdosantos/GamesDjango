{% extends 'catalogo/base.html' %}

{% block titulo %}{{ titulo_pagina }} - GameDex{% endblock %}

{% block conteudo %}
<section class="caixa-formulario">
    <h1>{{ titulo_pagina }}</h1>

    <form method="post" class="formulario">
        {% csrf_token %}
        {{ form.as_div }}

        <div class="botoes">
            <button type="submit" class="botao">Salvar</button>
            <a href="{% url 'lista_jogos' %}" class="botao botao-secundario">Cancelar</a>
        </div>
    </form>
</section>
{% endblock %}
