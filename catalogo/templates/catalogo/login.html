{% extends 'catalogo/base.html' %}

{% block titulo %}Entrar - GameDex{% endblock %}

{% block conteudo %}
<section class="caixa-formulario">
    <h1>Entrar</h1>

    <form method="post" class="formulario">
        {% csrf_token %}
        {{ form.as_div }}
        {# next guarda a página que pediu login, pra voltar pra ela #}
        <input type="hidden" name="next" value="{{ next }}">

        <div class="botoes">
            <button type="submit" class="botao">Entrar</button>
        </div>
    </form>

    <p>Ainda não tem conta? <a href="{% url 'cadastro' %}">Criar conta</a></p>
</section>
{% endblock %}
