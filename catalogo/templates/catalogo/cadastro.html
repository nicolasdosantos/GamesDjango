{% extends 'catalogo/base.html' %}

{% block titulo %}Criar conta - GameDex{% endblock %}

{% block conteudo %}
<section class="caixa-formulario">
    <h1>Criar conta</h1>

    <form method="post" class="formulario">
        {% csrf_token %}
        {# as_div monta os campos do form (label, input e erros) #}
        {{ form.as_div }}

        <div class="botoes">
            <button type="submit" class="botao">Criar conta</button>
        </div>
    </form>

    <p>Já tem conta? <a href="{% url 'login' %}">Entrar</a></p>
</section>
{% endblock %}
